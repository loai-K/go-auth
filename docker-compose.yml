name: goauth

services:
  auth-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:${PORT:-8080}"
    environment:
      - PORT=${PORT:-8080}
      - POSTGRES_DSN=${POSTGRES_DSN}
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${PORT:-8080}/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=goauth
      - POSTGRES_USER=goauth
      - POSTGRES_PASSWORD=goauth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goauth -d goauth"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
